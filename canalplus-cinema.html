      const configurations = { featured:'featured-card', categories:'category-card', top:'poster-card', essentials:'poster-card' };
      Object.entries(configurations).forEach(([id,className]) => {
        const rail = document.querySelector(`#${id}`);
        collections[id].forEach((item,index) => {
          const entry = document.createElement('li');
          const link = document.createElement('a');
          const image = document.createElement('img');
          link.className = `card ${className}`;
          link.href = '#';
          link.dataset.programmeTitle = item.label.split(/, (?:Film|Série|Sur )/)[0];
          link.dataset.programmeImage = item.image;
          link.setAttribute('aria-label', item.label);
          image.src = item.image;
          image.alt = '';
          image.loading = index < 4 ? 'eager' : 'lazy';
          image.decoding = 'async';
          link.append(image);
          entry.append(link);
          rail.append(entry);
        });
      });
      document.querySelectorAll('a[href="#"]').forEach(link => link.addEventListener('click', event => event.preventDefault()));
      document.querySelectorAll('.carousel').forEach(carousel => {
        const rail = carousel.querySelector('.rail');
        const previous = carousel.querySelector('.prev');
        const next = carousel.querySelector('.next');
        const update = () => {
          previous.disabled = rail.scrollLeft <= 3;
          next.disabled = rail.scrollLeft >= rail.scrollWidth - rail.clientWidth - 3;
        };
        const move = direction => {
          const card = rail.querySelector('.card');
          const distance = card ? card.getBoundingClientRect().width + 14 : rail.clientWidth * .8;
          rail.scrollBy({ left:direction * distance, behavior:matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
        };
        previous.addEventListener('click', () => move(-1));
        next.addEventListener('click', () => move(1));
        rail.addEventListener('scroll', update, { passive:true });
        new ResizeObserver(update).observe(rail);
        update();
      });
    </script>
