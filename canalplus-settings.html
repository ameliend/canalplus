<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CANAL+ — Réglages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; --bg:#0d0d0d; --panel:#181818; --line:#292929; --muted:#b7b7b7; }
      * { box-sizing:border-box; }
      body { min-width:320px; min-height:100vh; margin:0; background:var(--bg); color:#fff; font-family:Arial, Helvetica, sans-serif; }
      .topbar { height:64px; display:flex; align-items:center; gap:46px; padding:0 42px; border-bottom:2px solid #242424; background:#0b0b0b; }
      .logo { display:block; flex:none; width:128px; height:32px; }
      .logo img { display:block; width:100%; height:100%; }
      nav { display:flex; gap:42px; align-items:center; font-family:'Hind', Arial, sans-serif; font-size:16px; font-weight:600; white-space:nowrap; }
      nav a { color:#f1f1f1; text-decoration:none; }
      .tools { display:flex; align-items:center; gap:28px; margin-left:auto; }
      .search, .avatar { padding:0; cursor:pointer; }
      .search { width:24px; height:24px; border:0; background:transparent; color:#fff; }
      .search svg { display:block; width:24px; height:24px; }
      .avatar { width:32px; height:32px; border:2px solid #97cbe9; border-radius:50%; background:#111 url('https://thumb.canalplus.pro/bran/unsafe/64x64/filters:quality(85)/image/65de0dc1c69d8/uploads/media/FLAMBEAU_JeromeCommandeur.png') center/cover no-repeat; }
      main { width:min(684px, calc(100% - 40px)); margin:72px auto 80px; }
      h1 { margin:0 0 48px; font:800 italic 24px/29px 'Hind', Arial, sans-serif; }
      h2 { margin:0 0 24px; font:600 22px/27px 'Hind', Arial, sans-serif; }
      .settings { width:100%; padding:19px 0; background:var(--panel); }
      .setting { width:100%; height:53px; padding:0 34px; border:0; border-bottom:1px solid var(--line); background:transparent; color:#fff; font:400 18px/53px 'Hind', Arial, sans-serif; text-align:left; cursor:pointer; }
      .setting:last-child { border-bottom:0; }
      .setting-content { display:flex; align-items:center; justify-content:space-between; width:100%; height:100%; }
      .setting-value { display:flex; align-items:center; gap:14px; color:var(--muted); }
      .chevron { display:block; width:10px; height:10px; border-top:2px solid #bdbdbd; border-right:2px solid #bdbdbd; transform:rotate(45deg); }
      .setting:hover .setting-content { color:#fff; }
      .setting:focus-visible, a:focus-visible { outline:2px solid #fff; outline-offset:4px; }
      @media (max-width:850px) { .topbar { gap:20px; padding:0 18px; } nav { gap:20px; overflow:hidden; } nav a:nth-child(n+3) { display:none; } main { margin-top:44px; } h1 { margin-bottom:36px; } .settings { padding:19px 0; } .setting { padding:0 20px; } }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="./canalplus-home-improved.html" aria-label="CANAL+, accueil"><img src="./canalplus-logo-v2.svg" onerror="this.onerror=null;this.src='./assets/canalplus-logo-v2.svg'" alt="CANAL+" /></a>
      <nav aria-label="Navigation principale">
        <a href="./canalplus-home-improved.html">Accueil</a>
        <a href="./canalplus-live.html">TV en direct</a>
        <a href="./canalplus-channels.html">Chaînes &amp; Apps</a>
        <a href="./canalplus-videos.html">Mes vidéos</a>
      </nav>
      <div class="tools">
        <button class="search" type="button" aria-label="Rechercher"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M17.762 14.07a5.52 5.52 0 0 1-3.917 1.622 5.539 5.539 0 1 1 3.917-1.623m1.821-9.653A8.2 8.2 0 0 0 13.75 2a8.2 8.2 0 0 0-5.834 2.417 8.2 8.2 0 0 0-2.417 5.835 8.2 8.2 0 0 0 1.527 4.78l-4.623 4.624a1.372 1.372 0 0 0 1.94 1.941l4.625-4.623a8.2 8.2 0 0 0 4.78 1.526 8.2 8.2 0 0 0 5.836-2.415A8.2 8.2 0 0 0 22 10.25a8.2 8.2 0 0 0-2.417-5.834" clip-rule="evenodd"></path></svg></button>
        <a class="avatar" href="./canalplus-home-improved.html" aria-label="Retour au menu utilisateur"></a>
      </div>
    </header>
    <main>
      <h1>RÉGLAGES</h1>
      <section aria-labelledby="preferences-title">
        <h2 id="preferences-title">Préférences</h2>
        <div class="settings">
          <button class="setting" type="button"><span class="setting-content"><span>Enchaînement des épisodes</span><span class="setting-value">Activé <span class="chevron" aria-hidden="true"></span></span></span></button>
          <button class="setting" type="button"><span class="setting-content"><span>Lecture automatique</span><span class="setting-value"><span class="chevron" aria-hidden="true"></span></span></span></button>
          <button class="setting" type="button"><span class="setting-content"><span>Qualité des images</span><span class="setting-value">Intermédiaire <span class="chevron" aria-hidden="true"></span></span></span></button>
          <button class="setting" type="button"><span class="setting-content"><span>Profils au démarrage</span><span class="setting-value">Activé <span class="chevron" aria-hidden="true"></span></span></span></button>
          <button class="setting" type="button"><span class="setting-content"><span>Personnalisation</span><span class="setting-value">Activé <span class="chevron" aria-hidden="true"></span></span></span></button>
        </div>
      </section>
    </main>
    <script src="./user-menu.js"></script>
  </body>
</html>
